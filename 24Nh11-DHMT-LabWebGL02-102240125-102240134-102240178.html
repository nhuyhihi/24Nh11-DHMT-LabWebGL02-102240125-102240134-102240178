<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>WebGL - 2D Geometry Matrix Transform (Duck)</title>
<link type="text/css" href="./js/webgl-tutorials.css" rel="stylesheet">
</head>
<body>
<div class="description">
Drag sliders to translate, rotate, scale, and toggle symmetry.
</div>
<canvas id="canvas" width="399" height="299"></canvas>
<div id="uiContainer">
  <div id="ui">
    <div id="x">
      <div class="gman-widget-outer">
        <div class="gman-widget-label">x</div>
        <div class="gman-widget-value">60</div>
        <input class="gman-widget-slider" type="range" min="0" max="399" value="60">
      </div>
    </div>
    <div id="y">
      <div class="gman-widget-outer">
        <div class="gman-widget-label">y</div>
        <div class="gman-widget-value">40</div>
        <input class="gman-widget-slider" type="range" min="0" max="299" value="40">
      </div>
    </div>
    <div id="angle">
      <div class="gman-widget-outer">
        <div class="gman-widget-label">angle</div>
        <div class="gman-widget-value">0</div>
        <input class="gman-widget-slider" type="range" min="0" max="360" value="0">
      </div>
    </div>
    <div id="scaleX">
      <div class="gman-widget-outer">
        <div class="gman-widget-label">scaleX</div>
        <div class="gman-widget-value">0.85</div>
        <input class="gman-widget-slider" type="range" min="-500" max="500" value="85">
      </div>
    </div>
    <div id="scaleY">
      <div class="gman-widget-outer">
        <div class="gman-widget-label">scaleY</div>
        <div class="gman-widget-value">0.85</div>
        <input class="gman-widget-slider" type="range" min="-500" max="500" value="85">
      </div>
    </div>
    <div id="symX">
      <div class="gman-widget-outer">
        <label><input type="checkbox" id="chkSymX"> Symmetric X</label>
      </div>
    </div>
    <div id="symY">
      <div class="gman-widget-outer">
        <label><input type="checkbox" id="chkSymY"> Symmetric Y</label>
      </div>
    </div>
    </div>
</div>

<script id="vertex-shader-2d" type="x-shader/x-vertex">
attribute vec2 a_position;
uniform vec2 u_resolution;
uniform mat3 u_matrix;
void main() {
  vec2 position = (u_matrix * vec3(a_position, 1)).xy;
  vec2 zeroToOne = position / u_resolution;
  vec2 zeroToTwo = zeroToOne * 2.0;
  vec2 clipSpace = zeroToTwo - 1.0;
  gl_Position = vec4(clipSpace * vec2(1, -1), 0, 1);
}
</script>

<script id="fragment-shader-2d" type="x-shader/x-fragment">
precision mediump float;
uniform vec4 u_color;
void main() {
  gl_FragColor = u_color;
}
</script>

<script src="./js/webgl-utils.js"></script>
<script src="./js/webgl-lessons-ui.js"></script>
<script>
"use strict";

function main() {
  var canvas = document.querySelector("#canvas");
  var gl = canvas.getContext("webgl");
  if (!gl) {
    return;
  }

  var program = webglUtils.createProgramFromScripts(gl, ["vertex-shader-2d", "fragment-shader-2d"]);
  var positionLocation = gl.getAttribLocation(program, "a_position");
  
  var resolutionLocation = gl.getUniformLocation(program, "u_resolution");
  var colorLocation = gl.getUniformLocation(program, "u_color");
  var matrixLocation = gl.getUniformLocation(program, "u_matrix");

  var positionBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
  
  setGeometry(gl);

  var translation = [60, 60]; // Dịch vị trí y một chút để đàn vịt không sát viền trên
  var angleInRadians = 0;
  var scale = [0.85, 0.85];
  
  // Khởi tạo 2 biến symX, symY
  var symX = 1;
  var symY = 1;

  var color = [Math.random(), Math.random(), Math.random(), 1];

  drawScene();

  webglLessonsUI.setupSlider("#x", {value: translation[0], slide: updatePosition(0), max: gl.canvas.width });
  webglLessonsUI.setupSlider("#y", {value: translation[1], slide: updatePosition(1), max: gl.canvas.height});
  webglLessonsUI.setupSlider("#angle", {slide: updateAngle, max: 360});
  webglLessonsUI.setupSlider("#scaleX", {value: scale[0], slide: updateScale(0), min: -5, max: 5, step: 0.01, precision: 2});
  webglLessonsUI.setupSlider("#scaleY", {value: scale[1], slide: updateScale(1), min: -5, max: 5, step: 0.01, precision: 2});

  // Bắt đầu phần addEventListener cho Checkbox
  document.getElementById("chkSymX").addEventListener('change', function(e) {
    symX = e.target.checked ? -1 : 1;
    drawScene();
  });
  document.getElementById("chkSymY").addEventListener('change', function(e) {
    symY = e.target.checked ? -1 : 1;
    drawScene();
  });

  function updatePosition(index) {
    return function(event, ui) {
      translation[index] = ui.value;
      drawScene();
    };
  }

  function updateAngle(event, ui) {
    var angleInDegrees = 360 - ui.value;
    angleInRadians = angleInDegrees * Math.PI / 180;
    drawScene();
  }

  function updateScale(index) {
    return function(event, ui) {
      scale[index] = ui.value;
      drawScene();
    };
  }

  function drawScene() {
    webglUtils.resizeCanvasToDisplaySize(gl.canvas);
    gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(program);
    gl.enableVertexAttribArray(positionLocation);
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);

    var size = 2;          
    var type = gl.FLOAT;   
    var normalize = false; 
    var stride = 0;        
    var offset = 0;        
    gl.vertexAttribPointer(positionLocation, size, type, normalize, stride, offset);

    gl.uniform2f(resolutionLocation, gl.canvas.width, gl.canvas.height);
    gl.uniform4fv(colorLocation, color);

    var translationMatrix = m3.translation(translation[0], translation[1]);
    var rotationMatrix = m3.rotation(angleInRadians);
    var scaleMatrix = m3.scaling(scale[0], scale[1]);
    
    //Khởi tạo biến symMatrix
    var symMatrix = m3.scaling(symX, symY); 

    var matrix = m3.identity();

    for (var i = 0; i < 5; ++i) {
      matrix = m3.multiply(matrix, translationMatrix);
      matrix = m3.multiply(matrix, rotationMatrix);
      matrix = m3.multiply(matrix, scaleMatrix);
      
      //Nhân thêm ma trận symMatrix
      matrix = m3.multiply(matrix, symMatrix); 

      gl.uniformMatrix3fv(matrixLocation, false, matrix);

      var primitiveType = gl.TRIANGLES;
      var offset_draw = 0;
      
      // đổi biến count thành 21 (7 tam giác x 3 đỉnh)
      var count = 21; 
      gl.drawArrays(primitiveType, offset_draw, count);
    }
  }
}

var m3 = {
  identity: function() { return [ 1, 0, 0, 0, 1, 0, 0, 0, 1, ]; },
  translation: function(tx, ty) { return [ 1, 0, 0, 0, 1, 0, tx, ty, 1, ]; },
  rotation: function(angleInRadians) {
    var c = Math.cos(angleInRadians);
    var s = Math.sin(angleInRadians);
    return [ c,-s, 0, s, c, 0, 0, 0, 1, ];
  },
  scaling: function(sx, sy) { return [ sx, 0, 0, 0, sy, 0, 0, 0, 1, ]; },
  multiply: function(a, b) {
    var a00 = a[0 * 3 + 0]; var a01 = a[0 * 3 + 1]; var a02 = a[0 * 3 + 2];
    var a10 = a[1 * 3 + 0]; var a11 = a[1 * 3 + 1]; var a12 = a[1 * 3 + 2];
    var a20 = a[2 * 3 + 0]; var a21 = a[2 * 3 + 1]; var a22 = a[2 * 3 + 2];
    var b00 = b[0 * 3 + 0]; var b01 = b[0 * 3 + 1]; var b02 = b[0 * 3 + 2];
    var b10 = b[1 * 3 + 0]; var b11 = b[1 * 3 + 1]; var b12 = b[1 * 3 + 2];
    var b20 = b[2 * 3 + 0]; var b21 = b[2 * 3 + 1]; var b22 = b[2 * 3 + 2];
    return [
      b00 * a00 + b01 * a10 + b02 * a20,
      b00 * a01 + b01 * a11 + b02 * a21,
      b00 * a02 + b01 * a12 + b02 * a22,
      b10 * a00 + b11 * a10 + b12 * a20,
      b10 * a01 + b11 * a11 + b12 * a21,
      b10 * a02 + b11 * a12 + b12 * a22,
      b20 * a00 + b21 * a10 + b22 * a20,
      b20 * a01 + b21 * a11 + b22 * a21,
      b20 * a02 + b21 * a12 + b22 * a22,
    ];
  },
};

// Toàn bộ hàm setGeometry (Tọa độ hình Con Vịt)
function setGeometry(gl) {
  gl.bufferData(
      gl.ARRAY_BUFFER,
      new Float32Array([
          // 1. Đầu vịt (Head)
          70, 20,   100, 20,   70, 50,
          100, 20,  100, 50,   70, 50,

          // 2. Mỏ vịt (Beak)
          100, 30,  125, 35,   100, 45,

          // 3. Thân vịt (Body)
          40, 50,   110, 50,   40, 90,
          110, 50,  110, 90,   40, 90,

          // 4. Ngực vịt (Chest) 
          110, 50,  130, 70,   110, 90,

          // 5. Đuôi vịt (Tail) 
          40, 50,   15, 30,    40, 80,
      ]),
      gl.STATIC_DRAW);
}

main();
</script>
</body></html>
